name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goldloan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/goldloan
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/goldloan
      RATE_24K_PAISE_PER_GRAM: "700000"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate --workspace server
      - run: npx prisma migrate deploy --schema server/prisma/schema.prisma
      - run: npm run db:seed

      - run: npm run build
      - run: npm test
        # The agent eval needs an LLM key and is intentionally not run in CI.
